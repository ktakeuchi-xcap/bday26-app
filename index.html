<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>30歳、はじまりの一日</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    background: #faf7f2;
    color: #333;
    margin: 0;
    padding: 24px;
    line-height: 1.7;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
  }
  input {
    display: block;
    width: 100%;
    box-sizing: border-box;
    padding: 8px;
    margin: 8px 0;
    font-size: 1rem;
  }
  button {
    display: block;
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    font-size: 1rem;
    cursor: pointer;
  }
  .link {
    color: #a15c2c;
    text-decoration: underline;
    cursor: pointer;
  }
  .feedback {
    color: #c0392b;
  }
  .countdown {
    font-size: 1.2rem;
    font-weight: bold;
  }
  p {
    white-space: pre-wrap;
  }
  .debug-skip {
    /* 動作確認用の隠しボタン。本番前に削除・無効化を検討 */
    width: auto;
    padding: 4px 8px;
    margin: 24px auto 0;
    font-size: 0.7rem;
    opacity: 0.15;
    background: none;
    border: none;
    color: #999;
  }
  .danger {
    background: #fff;
    border: 1px solid #c0392b;
    color: #c0392b;
    margin-top: 24px;
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
