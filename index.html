<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>30歳、はじまりの一日</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-a: #eaf0f4;
    --bg-b: #f3eaf0;
    --bg-c: #fbf0e8;
    --text: #35323a;
    --accent: #8c6e9c;
    --accent-dark: #6f5480;
    --danger: #b9564b;
    --card-bg: rgba(255, 255, 255, 0.6);
  }
  body {
    font-family: "Zen Kaku Gothic New", system-ui, sans-serif;
    background: linear-gradient(165deg, var(--bg-a) 0%, var(--bg-b) 55%, var(--bg-c) 100%);
    color: var(--text);
    margin: 0;
    padding: 24px;
    line-height: 1.8;
    min-height: 100vh;
  }
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(50px);
    opacity: 0.5;
    z-index: -1;
    pointer-events: none;
  }
  .blob-1 { top: -60px; left: -60px; width: 220px; height: 220px; background: #cdd9e8; }
  .blob-2 { bottom: -80px; right: -60px; width: 260px; height: 260px; background: #e6cfe0; }
  .blob-3 { top: 40%; right: -100px; width: 200px; height: 200px; background: #f4dcc4; }
  #app {
    max-width: 480px;
    margin: 0 auto;
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  #app.fade-in {
    opacity: 1;
  }
  h2 {
    font-family: "Shippori Mincho", serif;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  input {
    display: block;
    width: 100%;
    box-sizing: border-box;
    padding: 10px 12px;
    margin: 8px 0;
    font-size: 1rem;
    font-family: inherit;
    border: 1px solid #d8cfd8;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.7);
  }
  button {
    display: block;
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    font-size: 1rem;
    font-family: inherit;
    cursor: pointer;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    transition: background 0.2s ease, transform 0.1s ease;
  }
  button:hover {
    background: var(--accent-dark);
  }
  button:active {
    transform: scale(0.98);
  }
  button:disabled {
    background: #cfc7d1;
    color: #8a8390;
    cursor: not-allowed;
  }
  button:disabled:hover {
    background: #cfc7d1;
  }
  .quiz-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin: 12px 0;
  }
  .quiz-option {
    cursor: pointer;
    border: 3px solid transparent;
    border-radius: 14px;
    padding: 4px;
    background: var(--card-bg);
    text-align: center;
    transition: border-color 0.2s ease, transform 0.1s ease;
  }
  .quiz-option img {
    margin: 0;
    border-radius: 10px;
    aspect-ratio: 1 / 1;
    object-fit: cover;
  }
  .quiz-option-label {
    margin: 4px 0 2px;
    font-weight: 600;
    color: var(--text);
  }
  .quiz-option.selected {
    border-color: var(--accent);
  }
  .quiz-option:active {
    transform: scale(0.98);
  }
  .link {
    display: block;
    color: var(--text);
    background: var(--card-bg);
    border: 1px solid rgba(140, 110, 156, 0.25);
    border-radius: 12px;
    padding: 10px 14px;
    margin: 8px 0;
    text-decoration: none;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(140, 110, 156, 0.08);
    transition: box-shadow 0.2s ease, transform 0.1s ease;
  }
  .link:hover {
    box-shadow: 0 4px 12px rgba(140, 110, 156, 0.16);
  }
  .link:active {
    transform: scale(0.99);
  }
  .feedback {
    color: var(--danger);
  }
  .countdown {
    font-size: 1.2rem;
    font-weight: bold;
    font-family: "Shippori Mincho", serif;
  }
  p {
    white-space: pre-wrap;
  }
  #app img {
    display: block;
    max-width: 100%;
    height: auto;
    margin: 8px 0;
    border-radius: 14px;
    box-shadow: 0 4px 16px rgba(53, 50, 58, 0.12);
  }
  /* QRコードは角丸・影で読み取り精度を落とさないよう、四角のまま表示する */
  .ticket-qr {
    max-width: 220px;
    margin: 8px auto;
    border-radius: 0;
    box-shadow: none;
    background: #fff;
    padding: 8px;
  }
  .progress {
    background: rgba(140, 110, 156, 0.15);
    border-radius: 999px;
    height: 8px;
    overflow: hidden;
  }
  .progress-fill {
    background: var(--accent);
    height: 100%;
    transition: width 0.2s ease;
  }
  .progress-label {
    font-size: 0.8rem;
    color: #7a7580;
    margin: 4px 0 12px;
  }
  .hint-toggle {
    background: transparent;
    color: var(--accent);
    border: 1px solid rgba(140, 110, 156, 0.4);
  }
  .hint-toggle:hover {
    background: rgba(140, 110, 156, 0.08);
  }
  .correct-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Shippori Mincho", serif;
    font-size: 2.2rem;
    font-weight: 600;
    color: var(--accent-dark);
    background: rgba(255, 255, 255, 0.55);
    backdrop-filter: blur(3px);
    z-index: 50;
    animation: correct-pop 0.9s ease forwards;
    pointer-events: none;
  }
  @keyframes correct-pop {
    0% { opacity: 0; transform: scale(0.7); }
    20% { opacity: 1; transform: scale(1.08); }
    35% { transform: scale(1); }
    80% { opacity: 1; }
    100% { opacity: 0; }
  }
  .venue-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    background: var(--card-bg);
    border: 1px solid rgba(140, 110, 156, 0.2);
    border-radius: 14px;
    padding: 28px 16px;
    margin: 8px 0 16px;
    box-shadow: 0 4px 14px rgba(140, 110, 156, 0.12);
    text-align: center;
    animation: venue-card-slide-up 0.5s ease;
  }
  .venue-card-badge {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(155deg, var(--accent), var(--accent-dark));
    color: #fff;
    font-family: "Shippori Mincho", serif;
    font-size: 1.6rem;
    font-weight: 600;
    box-shadow: 0 4px 10px rgba(140, 110, 156, 0.35);
  }
  .venue-card-badge-goal {
    font-size: 1.8rem;
  }
  .venue-card-text {
    margin: 0;
    font-size: 1.05rem;
  }
  @keyframes venue-card-slide-up {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .venue-nav-row {
    display: flex;
    gap: 8px;
  }
  .venue-nav-back {
    flex: 1;
    background: transparent;
    color: var(--accent);
    border: 1px solid rgba(140, 110, 156, 0.4);
  }
  .venue-nav-back:hover {
    background: rgba(140, 110, 156, 0.08);
  }
  .venue-nav-next {
    flex: 2;
  }
  .kickoff-wrapper {
    position: relative;
  }
  .kickoff-pin {
    position: sticky;
    top: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .kickoff-line {
    position: absolute;
    left: 16px;
    right: 16px;
    text-align: center;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  .kickoff-line.in-view {
    opacity: 1;
  }
  .kickoff-scroll-guide {
    position: fixed;
    right: 16px;
    bottom: 70px;
    margin: 0;
    font-size: 0.8rem;
    color: #999;
    animation: kickoff-guide-bounce 1.5s infinite;
    z-index: 5;
  }
  @keyframes kickoff-guide-bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(6px); }
  }
  .kickoff-restart {
    display: none;
    position: fixed;
    right: 16px;
    bottom: 16px;
    width: auto;
    padding: 8px 14px;
    margin: 0;
    font-size: 0.85rem;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 999px;
    box-shadow: 0 4px 12px rgba(140, 110, 156, 0.3);
    z-index: 10;
  }
  .kickoff-next {
    display: none;
    position: fixed;
    left: 50%;
    bottom: 16px;
    transform: translateX(-50%);
    width: auto;
    padding: 10px 20px;
    margin: 0;
    font-size: 0.95rem;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 999px;
    box-shadow: 0 4px 12px rgba(140, 110, 156, 0.3);
    z-index: 10;
  }
  .danger {
    background: rgba(255, 255, 255, 0.7);
    border: 1px solid var(--danger);
    color: var(--danger);
    margin-top: 24px;
  }
  .navbar {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .navbar .nav {
    flex: 1;
    width: auto;
    padding: 6px;
    margin: 0;
    font-size: 0.85rem;
    background: rgba(255, 255, 255, 0.6);
    border: 1px solid rgba(140, 110, 156, 0.25);
    color: var(--text);
    border-radius: 8px;
  }
</style>
</head>
<body>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>
<div id="app"></div>
<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
